name: Build & Push Server Image

# Publishes the deepthought-server image to Docker Hub (default:
# rkhoja/deepthought-server). Same shape as the aleph house pattern
# (deploy-gateway.yml): path-filtered push to main + workflow_dispatch;
# auth via DOCKER_HUB_USER / DOCKER_HUB_TOKEN secrets, optional
# DOCKER_HUB_REPO secret or repository Variable override.
#
# Server-only: the Go compile happens inside docker build
# (deepthought-cli/Dockerfile, multi-stage → distroless). No CLI checks,
# binaries, or artifacts are produced here.

on:
  push:
    branches:
      - main
    paths:
      - 'deepthought-cli/**'
      - '.github/workflows/build-server.yml'
  workflow_dispatch:
    inputs:
      IMAGE_TAG:
        description: 'Immutable image tag override (default: server-<shortsha>)'
        required: false
        default: ''
      STABLE_TAG:
        description: 'Stable moving tag (default: latest)'
        required: false
        default: 'latest'

jobs:
  test-store:
    name: Store tests (MySQL)
    runs-on: ubuntu-24.04

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: deepthought
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: deepthought-cli/go.mod

      - name: Run MySQL store tests
        env:
          DEEPTHOUGHT_MYSQL_DSN: root:root@tcp(127.0.0.1:3306)/deepthought
        run: |
          set -uo pipefail
          cd deepthought-cli
          # Failures are echoed into the job summary, which is publicly
          # viewable (the run log requires auth).
          go test ./internal/history -run TestMySQL -v -count=1 2>&1 | tee /tmp/test.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            {
              echo "## MySQL test failures"
              echo '```'
              grep -E "FAIL|--- FAIL|Error|error|panic" /tmp/test.log | head -40
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            # Annotations are readable via the public API (summaries are not).
            grep -E "^--- FAIL|^    .*\.go:[0-9]+:|Error [0-9]+|panic" /tmp/test.log | head -10 | while IFS= read -r line; do
              echo "::error::${line}"
            done
            exit "$status"
          fi

  build-and-push:
    name: Build & Push Server
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve image repository
        id: repo
        env:
          SECRET_REPO: ${{ secrets.DOCKER_HUB_REPO }}
          VAR_REPO: ${{ vars.DOCKER_HUB_REPO }}
        run: |
          set -euo pipefail
          REPO="${SECRET_REPO}"
          if [ -z "${REPO}" ]; then
            REPO="${VAR_REPO}"
          fi
          if [ -z "${REPO}" ]; then
            REPO="rkhoja/deepthought-server"
          fi
          echo "IMAGE_REPO=${REPO}" >> "$GITHUB_OUTPUT"
          echo "Using IMAGE_REPO=${REPO}"

      - name: Resolve tags
        id: tags
        env:
          INPUT_IMAGE_TAG: ${{ github.event.inputs.IMAGE_TAG }}
          INPUT_STABLE_TAG: ${{ github.event.inputs.STABLE_TAG }}
          VAR_STABLE_TAG: ${{ vars.STABLE_TAG }}
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA::7}"

          IMAGE_TAG="${INPUT_IMAGE_TAG}"
          if [ -z "${IMAGE_TAG}" ]; then
            IMAGE_TAG="server-${SHORT_SHA}"
          fi

          STABLE_TAG="${INPUT_STABLE_TAG}"
          if [ -z "${STABLE_TAG}" ]; then
            STABLE_TAG="${VAR_STABLE_TAG}"
          fi
          if [ -z "${STABLE_TAG}" ]; then
            STABLE_TAG="latest"
          fi

          echo "IMAGE_TAG=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "STABLE_TAG=${STABLE_TAG}" >> "$GITHUB_OUTPUT"
          echo "Using IMAGE_TAG=${IMAGE_TAG}"
          echo "Using STABLE_TAG=${STABLE_TAG}"

      - name: Login to DockerHub
        env:
          # Username from either store (it's not sensitive); token strictly
          # from secrets — a variable would expose it in plaintext.
          DHU: ${{ vars.DOCKER_HUB_USER || secrets.DOCKER_HUB_USER }}
          DHT: ${{ secrets.DOCKER_HUB_TOKEN }}
        run: |
          set -euo pipefail
          # Lengths only, never values: 0 means the secret is not visible to
          # this job (wrong level/name); nonzero means a value problem.
          echo "DOCKER_HUB_USER length: ${#DHU}"
          echo "DOCKER_HUB_TOKEN length: ${#DHT}"
          echo "${DHT}" | docker login -u "${DHU}" --password-stdin

      - name: Build Docker image
        run: |
          set -euo pipefail
          docker build \
            -t "${{ steps.repo.outputs.IMAGE_REPO }}:${{ steps.tags.outputs.IMAGE_TAG }}" \
            -t "${{ steps.repo.outputs.IMAGE_REPO }}:${{ steps.tags.outputs.STABLE_TAG }}" \
            deepthought-cli

      - name: Verify image candidate
        run: |
          set -euo pipefail
          # Distroless has no shell — invoke the server binary directly.
          docker run --rm --entrypoint /deepthought-server \
            "${{ steps.repo.outputs.IMAGE_REPO }}:${{ steps.tags.outputs.IMAGE_TAG }}" --help

      - name: Push image to DockerHub
        run: |
          set -euo pipefail
          docker push "${{ steps.repo.outputs.IMAGE_REPO }}:${{ steps.tags.outputs.IMAGE_TAG }}"
          docker push "${{ steps.repo.outputs.IMAGE_REPO }}:${{ steps.tags.outputs.STABLE_TAG }}"
