name: Build & Push Server Image

# The server's own lane — fully separate from the CLI pipeline; triggered
# only by deepthought-server/ changes (the module depends on the CLI in NO
# way). Publishes to Docker Hub (default: rkhoja/deepthought-server), same
# shape as the aleph house pattern (deploy-gateway.yml). The test job runs
# vet + all tests against a throwaway MySQL service (so the DSN-guarded store
# tests execute); only a green test job builds, smokes and pushes the image.

on:
  push:
    branches:
      - main
    paths:
      - 'deepthought-server/**'
      - '.github/workflows/build-server.yml'
  workflow_dispatch:
    inputs:
      IMAGE_TAG:
        description: 'Immutable image tag override (default: server-<shortsha>)'
        required: false
        default: ''
      STABLE_TAG:
        description: 'Stable moving tag (default: latest)'
        required: false
        default: 'latest'

jobs:
  test:
    name: Test Server
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-only
          MYSQL_DATABASE: deepthought_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-only"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: deepthought-server/go.mod
          cache-dependency-path: deepthought-server/go.sum

      - name: Vet
        run: |
          set -euo pipefail
          cd deepthought-server
          go vet ./...

      - name: Test
        env:
          DEEPTHOUGHT_MYSQL_DSN: root:ci-only@tcp(127.0.0.1:3306)/deepthought_test?parseTime=false
        run: |
          # The runner's default shell is bash -e; +e lets a failing test run
          # reach the annotation block below.
          set +e -uo pipefail
          cd deepthought-server
          go test ./... -count=1 -v 2>&1 | tee /tmp/test.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # Annotations are readable via the public API (summaries are not).
            { grep -E "^--- FAIL|^    .*\.go:[0-9]+:|panic" /tmp/test.log | head -10; echo "---- last lines ----"; tail -8 /tmp/test.log; } | while IFS= read -r line; do
              echo "::error::${line}"
            done
            exit "$status"
          fi
          if grep -q "DEEPTHOUGHT_MYSQL_DSN not set" /tmp/test.log; then
            echo "::error::MySQL store tests were skipped"
            exit 1
          fi

  build-and-push:
    name: Build & Push Server
    needs: test
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve image repository
        id: repo
        env:
          SECRET_REPO: ${{ secrets.DOCKER_HUB_REPO }}
          VAR_REPO: ${{ vars.DOCKER_HUB_REPO }}
        run: |
          set -euo pipefail
          REPO="${SECRET_REPO}"
          if [ -z "${REPO}" ]; then
            REPO="${VAR_REPO}"
          fi
          if [ -z "${REPO}" ]; then
            REPO="rkhoja/deepthought-server"
          fi
          echo "IMAGE_REPO=${REPO}" >> "$GITHUB_OUTPUT"
          echo "Using IMAGE_REPO=${REPO}"

      - name: Resolve tags
        id: tags
        env:
          INPUT_IMAGE_TAG: ${{ github.event.inputs.IMAGE_TAG }}
          INPUT_STABLE_TAG: ${{ github.event.inputs.STABLE_TAG }}
          VAR_STABLE_TAG: ${{ vars.STABLE_TAG }}
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA::7}"

          IMAGE_TAG="${INPUT_IMAGE_TAG}"
          if [ -z "${IMAGE_TAG}" ]; then
            IMAGE_TAG="server-${SHORT_SHA}"
          fi

          STABLE_TAG="${INPUT_STABLE_TAG}"
          if [ -z "${STABLE_TAG}" ]; then
            STABLE_TAG="${VAR_STABLE_TAG}"
          fi
          if [ -z "${STABLE_TAG}" ]; then
            STABLE_TAG="latest"
          fi

          echo "IMAGE_TAG=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "STABLE_TAG=${STABLE_TAG}" >> "$GITHUB_OUTPUT"
          echo "Using IMAGE_TAG=${IMAGE_TAG}"
          echo "Using STABLE_TAG=${STABLE_TAG}"

      - name: Login to DockerHub
        env:
          # Username from either store (it's not sensitive); token strictly
          # from secrets — a variable would expose it in plaintext.
          DHU: ${{ vars.DOCKER_HUB_USER || secrets.DOCKER_HUB_USER }}
          DHT: ${{ secrets.DOCKER_HUB_TOKEN }}
        run: |
          set -euo pipefail
          # Lengths only, never values: 0 means the secret is not visible to
          # this job (wrong level/name); nonzero means a value problem.
          echo "DOCKER_HUB_USER length: ${#DHU}"
          echo "DOCKER_HUB_TOKEN length: ${#DHT}"
          echo "${DHT}" | docker login -u "${DHU}" --password-stdin

      - name: Build Docker image
        run: |
          set -euo pipefail
          docker build \
            --build-arg DEEPTHOUGHT_VERSION="${{ steps.tags.outputs.IMAGE_TAG }}" \
            -t "${{ steps.repo.outputs.IMAGE_REPO }}:${{ steps.tags.outputs.IMAGE_TAG }}" \
            -t "${{ steps.repo.outputs.IMAGE_REPO }}:${{ steps.tags.outputs.STABLE_TAG }}" \
            deepthought-server

      - name: Verify image candidate
        run: |
          set -euo pipefail
          # Distroless has no shell — invoke the server binary directly.
          docker run --rm --entrypoint /deepthought-server \
            "${{ steps.repo.outputs.IMAGE_REPO }}:${{ steps.tags.outputs.IMAGE_TAG }}" --help

      - name: Push image to DockerHub
        run: |
          set -euo pipefail
          docker push "${{ steps.repo.outputs.IMAGE_REPO }}:${{ steps.tags.outputs.IMAGE_TAG }}"
          docker push "${{ steps.repo.outputs.IMAGE_REPO }}:${{ steps.tags.outputs.STABLE_TAG }}"
