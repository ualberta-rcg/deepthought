name: Build DeepThought CLI and server

# Builds + tests the DeepThought server and publishes its container image.
# Mirrors the aleph house pattern (deploy-gateway.yml): path-filtered push to
# main + workflow_dispatch; Docker publish uses the same secret names
# (DOCKER_HUB_USER / DOCKER_HUB_TOKEN) with an optional DOCKER_HUB_REPO
# secret/Variable override (default: rkhoja/deepthought-server). Login and
# push run unconditionally — missing credentials fail the job loudly.

on:
  push:
    branches:
      - main
    paths:
      - 'deepthought-cli/**'
      - '.github/workflows/build-server.yml'
  workflow_dispatch:
    inputs:
      IMAGE_TAG:
        description: 'Immutable image tag override (default: server-<shortsha>)'
        required: false
        default: ''
      STABLE_TAG:
        description: 'Stable moving tag (default: latest)'
        required: false
        default: 'latest'

jobs:
  test-and-build:
    name: Test + Build
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: deepthought-cli/go.mod

      - name: Vet + Test
        run: |
          set -euo pipefail
          cd deepthought-cli
          go vet ./...
          go test ./...
          go test -race ./internal/app ./internal/tui ./internal/queen ./internal/history ./internal/slurm ./internal/workflow ./internal/tools ./internal/transwarp ./internal/skills

      - name: Build static binary
        run: |
          set -euo pipefail
          cd deepthought-cli
          mkdir -p ../out
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w -X main.buildVersion=${GITHUB_SHA}" -o ../out/deepthought-cli ./cmd/deepthought-cli
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o ../out/deepthought-server ./cmd/deepthought-server
          ../out/deepthought-cli --version
          sha256sum ../out/deepthought-cli ../out/deepthought-server > ../out/SHA256SUMS
          ./../out/deepthought-server --help >/dev/null && echo "binary runs"

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: deepthought-${{ github.sha }}
          path: out/
          if-no-files-found: error

      # --- Docker publish (aleph house pattern: deploy-gateway.yml) -----------
      # Login and Push run unconditionally with the secrets inline; missing
      # credentials fail the job loudly rather than skipping the push. (The
      # previous env.HAS_DOCKER_CREDS gate never worked: a step-level `if`
      # cannot see the step's own `env:` block.)
      - name: Resolve image repository
        id: repo
        env:
          SECRET_REPO: ${{ secrets.DOCKER_HUB_REPO }}
          VAR_REPO: ${{ vars.DOCKER_HUB_REPO }}
        run: |
          set -euo pipefail
          REPO="${SECRET_REPO}"
          if [ -z "${REPO}" ]; then
            REPO="${VAR_REPO}"
          fi
          if [ -z "${REPO}" ]; then
            REPO="rkhoja/deepthought-server"
          fi
          echo "IMAGE_REPO=${REPO}" >> "$GITHUB_OUTPUT"
          echo "Using IMAGE_REPO=${REPO}"

      - name: Resolve tags
        id: tags
        env:
          INPUT_IMAGE_TAG: ${{ github.event.inputs.IMAGE_TAG }}
          INPUT_STABLE_TAG: ${{ github.event.inputs.STABLE_TAG }}
          VAR_STABLE_TAG: ${{ vars.STABLE_TAG }}
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA::7}"

          IMAGE_TAG="${INPUT_IMAGE_TAG}"
          if [ -z "${IMAGE_TAG}" ]; then
            IMAGE_TAG="server-${SHORT_SHA}"
          fi

          STABLE_TAG="${INPUT_STABLE_TAG}"
          if [ -z "${STABLE_TAG}" ]; then
            STABLE_TAG="${VAR_STABLE_TAG}"
          fi
          if [ -z "${STABLE_TAG}" ]; then
            STABLE_TAG="latest"
          fi

          echo "IMAGE_TAG=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "STABLE_TAG=${STABLE_TAG}" >> "$GITHUB_OUTPUT"
          echo "Using IMAGE_TAG=${IMAGE_TAG}"
          echo "Using STABLE_TAG=${STABLE_TAG}"

      - name: Login to DockerHub
        run: |
          set -euo pipefail
          echo "${{ secrets.DOCKER_HUB_TOKEN }}" | docker login -u "${{ secrets.DOCKER_HUB_USER }}" --password-stdin

      - name: Build Docker image
        run: |
          set -euo pipefail
          docker build \
            -t "${{ steps.repo.outputs.IMAGE_REPO }}:${{ steps.tags.outputs.IMAGE_TAG }}" \
            -t "${{ steps.repo.outputs.IMAGE_REPO }}:${{ steps.tags.outputs.STABLE_TAG }}" \
            deepthought-cli

      - name: Push image to DockerHub
        run: |
          set -euo pipefail
          docker push "${{ steps.repo.outputs.IMAGE_REPO }}:${{ steps.tags.outputs.IMAGE_TAG }}"
          docker push "${{ steps.repo.outputs.IMAGE_REPO }}:${{ steps.tags.outputs.STABLE_TAG }}"
