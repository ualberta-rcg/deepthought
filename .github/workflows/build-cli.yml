name: Build DeepThought CLI

# The CLI's own lane — fully separate from the server pipeline. Nothing
# docker, nothing server-side, NO service containers: vet + test + race, then
# ONE static binary as an artifact and on the rolling `edge` release:
#   curl -L -o deepthought-cli https://github.com/ualberta-rcg/deepthought/releases/download/edge/deepthought-cli
# Builds happen HERE, never on the login node and never via Slurm/CVMFS.

on:
  push:
    branches:
      - main
    paths:
      - 'deepthought-cli/**'
      - '.github/workflows/build-cli.yml'
      - 'install.sh'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deepthought-cli-main
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test + Build CLI
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: deepthought-cli/go.mod
          cache-dependency-path: deepthought-cli/go.sum

      - name: Vet
        run: |
          set -euo pipefail
          cd deepthought-cli
          go vet ./...

      - name: Test
        run: |
          set -uo pipefail
          cd deepthought-cli
          mkdir -p ../out
          export DEEPTHOUGHT_FIXTURE_PATH="$GITHUB_WORKSPACE/out/sidebar-fixtures.txt"
          go test ./... -count=1 2>&1 | tee /tmp/test.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            {
              echo "## Test failures"
              echo '```'
              grep -E "FAIL|--- FAIL|Error|error|panic" /tmp/test.log | head -60
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            # Annotations are readable via the public API (summaries are not).
            { grep -E "^--- FAIL|^    .*\.go:[0-9]+:|Error [0-9]+|panic" /tmp/test.log | head -10; echo "---- last lines ----"; tail -8 /tmp/test.log; } | while IFS= read -r line; do
              echo "::error::${line}"
            done
            exit "$status"
          fi
          cat ../out/sidebar-fixtures.txt

      - name: Race checks
        run: |
          set -euo pipefail
          cd deepthought-cli
          go test -race ./internal/app ./internal/tui ./internal/queen ./internal/history ./internal/config ./internal/host ./internal/babel ./internal/slurm ./internal/tools

      - name: Build static binary
        run: |
          set -euo pipefail
          cd deepthought-cli
          mkdir -p ../out
          CGO_ENABLED=0 go build -trimpath \
            -ldflags="-s -w -X main.buildVersion=${GITHUB_SHA}" \
            -o ../out/deepthought-cli ./cmd/deepthought-cli
          ../out/deepthought-cli --version
          (cd ../out && sha256sum deepthought-cli > SHA256SUMS)

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: deepthought-cli-${{ github.sha }}
          path: out/
          if-no-files-found: error

      - name: Publish to the rolling edge release (curl-able)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd deepthought-cli
          gh release delete edge --yes --cleanup-tag 2>/dev/null || true
          NOTES="Rolling build from main @ ${GITHUB_SHA::7}. One static binary (linux/amd64). Install: curl -L -o deepthought-cli https://github.com/ualberta-rcg/deepthought/releases/download/edge/deepthought-cli && chmod +x deepthought-cli"
          gh release create edge --title "deepthought-cli (edge)" --notes "$NOTES" --prerelease ../out/deepthought-cli ../out/SHA256SUMS

      - name: Verify published installer version
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          export DEEPTHOUGHT_INSTALL_DIR="$RUNNER_TEMP/deepthought-install-check"
          bash install.sh
          expected="$(out/deepthought-cli --version)"
          actual="$("$DEEPTHOUGHT_INSTALL_DIR/deepthought-cli" --version)"
          test "$actual" = "$expected"
          cmp out/deepthought-cli "$DEEPTHOUGHT_INSTALL_DIR/deepthought-cli"
